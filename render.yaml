services:
  - type: web
    name: ai-work-tools
    runtime: docker
    plan: free
    region: singapore
    branch: ai-work-tools
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8787"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false