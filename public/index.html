<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>AI WORK TOOLS</title><link rel="stylesheet" href="/style.css"></head><body><div class="layout"><aside><div class="brand">✦ <b>AI WORK TOOLS</b></div><button data-page="home">▦ 工作总览</button><button data-page="tools">◇ 工具管理</button><button data-page="logs">≡ 操作日志</button><small>● 独立工作环境</small></aside><main><header><div><small>PERSONAL AI OPERATIONS</small><h1 id="title">工作总览</h1></div><span id="who">管理员</span><button id="logout" class="hide">退出</button></header><section id="login" class="login"><div><small>SECURE ADMIN ACCESS</small><h2>欢迎回来</h2><p>登录管理你的 AI 工作工具</p></div><form id="form"><input name="username" placeholder="管理员账号" required><input name="password" type="password" placeholder="管理员密码" required><button>进入控制台 →</button><p id="err"></p></form></section><section id="home" class="hide"><div class="hero"><small>YOUR WORKSPACE</small><h2>把重复工作交给工具。</h2><p>统一管理自动化能力、连接状态与运行记录。</p></div><div class="stats"><article>工具总数<strong id="count">—</strong></article><article>已启用<strong id="enabled">—</strong></article><article>服务状态<strong class="green">在线</strong></article><article>运行时长<strong id="uptime">—</strong></article></div><h2>工具中心</h2><div id="cards" class="grid"></div><h2>最近操作</h2><div id="recent" class="box"></div></section><section id="tools" class="hide"><h2>工具接入与启停</h2><div id="manage" class="box"></div><p class="note">工具开关仅管理配置。浏览器、终端等执行引擎仍需安装并安全接入，不会伪装成已连接。</p></section><section id="logs" class="hide"><h2>管理员操作记录</h2><div id="alllogs" class="box"></div></section><footer>AI WORK TOOLS · 独立控制台</footer></main></div><script src="/app.js"></script></body></html>
